<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - AutoIndia Motors</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">
  <div style="max-width: 600px; margin: 100px auto; padding: 30px; background: #fff; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
    <h2 style="font-family: 'Rajdhani', sans-serif; margin-bottom: 20px; color: #212529;">Edit Profile</h2>
    <div style="display: flex; flex-direction: column; gap: 15px;">
      <label style="font-weight: 600; font-size: 14px;">Full Name</label>
      <input type="text" id="editName" value="Ramya" style="padding: 10px; border: 1px solid #ced4da; border-radius: 6px;">
      
      <label style="font-weight: 600; font-size: 14px;">Email Address</label>
      <input type="email" id="editEmail" value="ramya@autoindia.in" style="padding: 10px; border: 1px solid #ced4da; border-radius: 6px;">
      
      <label style="font-weight: 600; font-size: 14px;">Contact Number</label>
      <input type="text" id="editPhone" value="+91 9550553729" style="padding: 10px; border: 1px solid #ced4da; border-radius: 6px;">
      
      <button onclick="alert('Profile updated successfully!')" style="background: #ff4724; color: #fff; padding: 12px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 10px;">Save Changes</button>
      <a href="index.html" style="text-align: center; font-size: 13px; color: #6c757d; text-decoration: none; margin-top: 5px;">← Back to Home</a>
    </div>
  </div>
</body>
</html>
