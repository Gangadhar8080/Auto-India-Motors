<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Add Car</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
      .admin-wrapper { padding: 100px 5%; background: var(--dark3); min-height: 100vh; }
      .admin-card { background: var(--card); border-radius: 12px; padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 900px; margin-left: auto; margin-right: auto; }
      .admin-title { font-family: 'Rajdhani', sans-serif; font-size: 28px; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
      @media(max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
      .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
      .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: rgba(0,0,0,0.02); outline: none; transition: 0.3s; color: var(--text); }
      .form-group input:focus, .form-group select:focus { border-color: var(--red); }
      .btn-save { background: var(--red); color: #fff; width: 100%; padding: 16px; border: none; border-radius: 6px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
      .btn-save:hover { background: #e03e1e; transform: translateY(-2px); }
      .custom-list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); }
      .btn-delete { background: transparent; color: var(--red); border: 1px solid var(--red); padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; }
      .btn-delete:hover { background: var(--red); color: #fff; }
    </style>
</head>
<body class="light-mode">
  <script>
    if (localStorage.getItem('autoindia_theme') === 'dark') {
      document.body.classList.remove('light-mode');
      document.body.classList.add('dark-mode');
    }
  </script>

  <!-- NAV -->
  <nav id="navbar" style="display: flex; align-items: center; justify-content: space-between; padding: 0 4%; height: 70px; background: #fff; border-bottom: 1px solid var(--border); position: fixed; top: 0; width: 100%; z-index: 1000;">
    <div style="display: flex; align-items: center; gap: 40px;">
      <a href="index.html" class="nav-logo" style="display: flex; align-items: center; gap: 8px; text-decoration: none;">
        <div style="background: #ff4724; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700;">A</div>
        <span style="font-family: 'Rajdhani', sans-serif; font-size: 24px; font-weight: 700; color: #212529; letter-spacing: 2px;">AutoIndia <span style="color:var(--red); font-size: 14px;">ADMIN</span></span>
      </a>
    </div>
    <div class="nav-right-controls" style="display: flex; align-items: center; gap: 24px;">
      <button class="icon-btn" title="Toggle Theme" id="themeIcon" onclick="toggleTheme()" style="cursor: pointer; background: transparent; border: none; outline: none; color: inherit;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <button onclick="adminLogout()" class="nav-cta" style="background: #212529; border: none; cursor: pointer;">Logout</button>
    </div>
  </nav>

  <div class="admin-wrapper">
    <div class="admin-card">
      <div class="admin-title">🚙 Add New Car Listing</div>
      
      <div class="form-grid">
        <div class="form-group">
          <label>Brand</label>
          <select id="carBrand">
            <option value="Tata">Tata</option>
            <option value="Mahindra">Mahindra</option>
            <option value="Hyundai">Hyundai</option>
            <option value="Kia">Kia</option>
            <option value="Maruti Suzuki">Maruti Suzuki</option>
            <option value="Ford">Ford</option>
            <option value="Toyota">Toyota</option>
            <option value="Honda">Honda</option>
            <option value="MG">MG</option>
            <option value="Volkswagen">Volkswagen</option>
            <option value="Skoda">Skoda</option>
          </select>
        </div>
        <div class="form-group">
          <label>Car Name / Model</label>
          <input type="text" id="carName" placeholder="e.g., Nexon EV Max">
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="carType">
            <option value="SUV">SUV</option>
            <option value="Sedan">Sedan</option>
            <option value="Hatchback">Hatchback</option>
            <option value="EV">EV (Electric)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Condition</label>
          <select id="carCondition">
            <option value="New">Brand New</option>
            <option value="Used">Certified Pre-Owned (Used)</option>
            <option value="Good">Good Condition</option>
          </select>
        </div>
        
        <!-- NEW DETAILED FIELDS -->
        <div class="form-group">
          <label>Fuel Type</label>
          <select id="carFuel">
            <option value="Petrol">Petrol</option>
            <option value="Diesel">Diesel</option>
            <option value="Electric">Electric</option>
            <option value="CNG">CNG</option>
            <option value="Hybrid">Hybrid</option>
          </select>
        </div>
        <div class="form-group">
          <label>Engine CC / EV Battery Spec</label>
          <input type="text" id="carEngine" placeholder="e.g., 1.5L Turbo or 30.2kWh">
        </div>
        <div class="form-group">
          <label>Gearbox (Transmission)</label>
          <select id="carTransmission">
            <option value="Manual">Manual</option>
            <option value="Automatic">Automatic (AT)</option>
            <option value="AMT">AMT</option>
            <option value="DCT">DCT</option>
            <option value="CVT">CVT</option>
          </select>
        </div>
        <div class="form-group">
          <label>Mileage / EV Range</label>
          <input type="text" id="carMileage" placeholder="e.g., 18 kmpl or 437 km">
        </div>
        <div class="form-group">
          <label>Power (BHP)</label>
          <input type="text" id="carPower" placeholder="e.g., 120 HP">
        </div>
        <div class="form-group">
          <label>Seating Capacity</label>
          <input type="number" id="carSeats" placeholder="e.g., 5" value="5">
        </div>
        <div class="form-group">
          <label>Stock Available</label>
          <input type="number" id="carStock" placeholder="e.g., 5" value="5">
        </div>

        <div class="form-group">
          <label>Display Price Text</label>
          <input type="text" id="carPrice" placeholder="e.g., 15.50 Lakh">
        </div>
        <div class="form-group">
          <label>Numeric Price (For EMI Math)</label>
          <input type="number" id="carPriceNum" placeholder="e.g., 1550000">
        </div>
        <div class="form-group">
          <label>Image URL / Path</label>
          <input type="text" id="carImage" placeholder="e.g., images/car.jpg">
        </div>
        
        <div class="form-group" style="grid-column: 1 / -1;">
          <label>Key Features / Parts (Comma Separated)</label>
          <input type="text" id="carParts" placeholder="e.g., Panoramic Sunroof, 360 Camera, Level 2 ADAS">
        </div>
      </div>
      
      <button class="btn-save" onclick="saveNewCarLocally()">Save Car Listing</button>
    </div>

    <!-- MANAGE CUSTOM LISTINGS -->
    <div class="admin-card">
      <div class="admin-title">📋 Manage Custom Listings</div>
      <div id="customListingsContainer">
        Loading listings...
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="script.js"></script>
  <script>
    // Load existing custom cars so admin can delete them
    function loadCustomListings() {
      const container = document.getElementById('customListingsContainer');
      const customCars = JSON.parse(localStorage.getItem('autoIndiaCustomCars')) || [];
      
      if (customCars.length === 0) {
        container.innerHTML = '<p style="color: var(--muted); font-size: 14px;">No custom cars added yet.</p>';
        return;
      }

      container.innerHTML = customCars.map((car, index) => `
        <div class="custom-list-item">
          <div>
            <strong>${car.brand} ${car.name}</strong> <span style="font-size: 12px; color: var(--muted);">(${car.condition})</span>
            <div style="font-size: 13px; color: var(--gold);">₹${car.price} | ${car.fuel} | ${car.transmission}</div>
          </div>
          <button class="btn-delete" onclick="deleteCustomCar(${index})">Delete</button>
        </div>
      `).join('');
    }

    // Delete functionality
    function deleteCustomCar(index) {
      if(confirm('Are you sure you want to delete this listing?')) {
        let customCars = JSON.parse(localStorage.getItem('autoIndiaCustomCars')) || [];
        customCars.splice(index, 1);
        localStorage.setItem('autoIndiaCustomCars', JSON.stringify(customCars));
        showToast('🗑️ Listing deleted successfully!');
        loadCustomListings();
      }
    }

    // Security check to ensure only admin accesses this page
    window.addEventListener('load', () => {
      if(localStorage.getItem('autoIndiaAdminLoggedIn') !== 'true') {
        window.location.href = 'login.html';
      }
      loadCustomListings();
    });
  </script>
</body>
</html>
